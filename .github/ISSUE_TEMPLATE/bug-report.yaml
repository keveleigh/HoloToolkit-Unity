name: Bug Report
description: Create a bug report to help us improve
labels: ["Bug", "Triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report!

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what you see!
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Repro steps
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.
      placeholder: Paste any photos here.

  - type: dropdown
    id: generation
    attributes:
      label: MRTK generation
      description: What generation of MRTK are you using?
      options:
        - HoloToolkit
        - MRTK v2
        - MRTK3
    validations:
      required: true

  - type: input
    id: mrtk-version
    attributes:
      label: MRTK version
      description: More specifically, which MRTK version are you using?
      placeholder: e.g. 2.8.2

  - type: input
    id: unity-version
    attributes:
      label: Unity version
      description: Which version of Unity are you using?
      placeholder: e.g. 2020.3.36f1

  - type: checkboxes
    id: devices
    attributes:
      label: Target devices/runtimes
      description: You may select more than one.
      options:
        - label: HoloLens
        - label: HoloLens 2
        - label: WMR immersive
        - label: Quest
        - label: ARKit
        - label: ARCore
        - label: Other

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
